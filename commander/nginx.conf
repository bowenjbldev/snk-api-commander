server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: serve index.html for any unmatched path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
