server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enrutado en cliente: cualquier ruta no resuelta sirve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html revalida siempre para que un build nuevo (hashes nuevos) entre sin recarga dura;
    # lo de /_app/immutable/ queda cacheado a perpetuidad.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SvelteKit hashea el contenido de todo lo que hay bajo _app/immutable.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
