server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: serve index.html for any unmatched path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always revalidate so a new build (new asset hashes) is picked up without a
    # hard refresh; the content-hashed /assets/ below stay immutably cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Content-hashed assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
