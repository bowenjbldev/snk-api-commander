<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

  </sc-for>
  <div style="flex:1"></div>
  <div style="border-top:1px solid var(--border,#393939); margin-top:24px; padding:12px 16px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--helper,#8d8d8d)">snakecloud-cms v1.14.2</div>
</div>
</x-dc>

</body>
</html>
