services:
  # PHP Application (Laravel)
  app:
    image: snk-api-commander-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    restart: unless-stopped
    working_dir: /var/www/src
    cpus: "${APP_CONTAINER_CPUS:-6.0}"
    mem_limit: "${APP_CONTAINER_MEMORY:-2g}"
    pids_limit: ${APP_CONTAINER_PIDS:-128}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./src:/var/www/src
      # Historial Git (solo lectura) para insights por aplicación, acotado al package compartido.
      - ./.git:/var/www/.git:ro
      - /var/www/src/bootstrap/cache
      - ./docker/php/commander.ini:/usr/local/etc/php/conf.d/zz-commander.ini:ro
      - ./docker/php/fpm.conf:/usr/local/etc/php-fpm.d/zzzz-commander.conf:ro
    environment:
      DB_USERNAME: ${COMMANDER_DB_USERNAME:-commander_app}
      DB_PASSWORD: ${COMMANDER_DB_PASSWORD:-commander-local-secret}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      app-network:
        aliases:
          - api-app

  # Laravel scheduler: dispara los comandos programados (commander:* y kilkana:*).
  # schedule:work corre en foreground y evalúa el schedule cada minuto — el
  # equivalente Docker del cron `schedule:run`. Reusa la imagen del app pero
  # salta su entrypoint (migraciones/permisos ya los hace app); restart cubre
  # el arranque en frío mientras app instala vendor/.
  scheduler:
    image: snk-api-commander-app
    restart: unless-stopped
    working_dir: /var/www/src
    entrypoint: ["php", "artisan", "schedule:work"]
    volumes:
      - ./src:/var/www/src
      - ./.git:/var/www/.git:ro
      - /var/www/src/bootstrap/cache
    environment:
      DB_USERNAME: ${COMMANDER_DB_USERNAME:-commander_app}
      DB_PASSWORD: ${COMMANDER_DB_PASSWORD:-commander-local-secret}
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - app-network

  # Unico proceso con credenciales capaces de crear/eliminar bases y usuarios.
  provisioner:
    image: snk-api-commander-app
    restart: unless-stopped
    working_dir: /var/www/src
    entrypoint: ["sh", "-c"]
    command: ["php artisan commander:secure-tenants && exec php artisan queue:work --queue=provisioning --tries=3 --timeout=600"]
    volumes:
      - ./src:/var/www/src
      - /var/www/src/bootstrap/cache
    environment:
      DB_USERNAME: ${COMMANDER_DB_USERNAME:-commander_app}
      DB_PASSWORD: ${COMMANDER_DB_PASSWORD:-commander-local-secret}
      PROVISIONER_DB_HOST: db
      PROVISIONER_DB_PORT: 3306
      PROVISIONER_DB_DATABASE: commander
      PROVISIONER_DB_USERNAME: root
      PROVISIONER_DB_PASSWORD: ${PROVISIONER_DB_PASSWORD:-}
      CORE_ADMIN_EMAIL: ${CORE_ADMIN_EMAIL:-admin@snake.com}
      CORE_ADMIN_PASSWORD: ${CORE_ADMIN_PASSWORD:-secret1234}
      KILKANA_DEMO_READER_PASSWORD: ${KILKANA_DEMO_READER_PASSWORD:-password}
    depends_on:
      app:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    networks:
      - app-network

  # Nginx Service
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - BASE_DOMAIN=${BASE_DOMAIN:-snakepc.test}
      - TENANT_BASE_DOMAIN=${TENANT_BASE_DOMAIN:-kilkana.test}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # Tambien en los puertos estandar para que las URLs limpias (sin :8443) funcionen,
      # p.ej. https://commander.snakepc.test/. Requiere que 80/443 esten libres en el host.
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www/src
      - ./docker/nginx/conf.d/:/etc/nginx/templates/:ro
      - ./docker/nginx/certs/:/etc/nginx/certs/:ro
    networks:
      app-network:
        aliases:
          - commander.${BASE_DOMAIN:-snakepc.test}
    depends_on:
      app:
        condition: service_started

  # Punto de conexión opcional para un futuro cliente web de Commander.
  # No arranca con el backend: se activa explícitamente con `--profile spa`
  # después de crear `commander-web/package.json`.
  commander-web:
    profiles: ["spa"]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./commander-web:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    networks:
      - app-network

  # MariaDB: una base de control y una base aislada por instancia.
  db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      # Root sin password (SOLO local): únicamente el provisioner recibe estas credenciales DDL.
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: commander
      MARIADB_USER: ${COMMANDER_DB_USERNAME:-commander_app}
      MARIADB_PASSWORD: ${COMMANDER_DB_PASSWORD:-commander-local-secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # Bandeja de salida de mentira, para ver el correo como lo ve el lector. Captura TODO lo que
  # la app manda por SMTP y no lo deja salir, que es justo lo que se quiere en local: nadie
  # envía un boletín de pruebas a una dirección real por accidente.
  #
  # Sin volumen a propósito: la bandeja es efímera. Lo que importa del correo —a quién se le
  # mandó y en qué estado quedó— ya vive en la base.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app-network

  # Compatibilidad con volúmenes existentes: asegura el usuario no privilegiado de Commander.
  db-init:
    image: mariadb:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mariadb --ssl=0 -h db -uroot -e "CREATE USER IF NOT EXISTS '${COMMANDER_DB_USERNAME:-commander_app}'@'%' IDENTIFIED BY '${COMMANDER_DB_PASSWORD:-commander-local-secret}';
        ALTER USER '${COMMANDER_DB_USERNAME:-commander_app}'@'%' IDENTIFIED BY '${COMMANDER_DB_PASSWORD:-commander-local-secret}';
        GRANT ALL PRIVILEGES ON commander.* TO '${COMMANDER_DB_USERNAME:-commander_app}'@'%';"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
