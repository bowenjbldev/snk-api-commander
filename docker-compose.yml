services:
  # PHP Application (Laravel)
  app:
    image: snake-laravel-api-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    restart: unless-stopped
    working_dir: /var/www/src
    volumes:
      - ./src:/var/www/src
      - /var/www/src/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - api-app

  # Nginx Service
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - BASE_DOMAIN=${BASE_DOMAIN:-snake.test}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # Tambien en los puertos estandar para que las URLs limpias (sin :8443) funcionen,
      # p.ej. https://commander.snake.test/. Requiere que 80/443 esten libres en el host.
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www/src
      - ./docker/nginx/conf.d/:/etc/nginx/templates/:ro
      - ./docker/nginx/certs/:/etc/nginx/certs/:ro
    networks:
      app-network:
        aliases:
          - commander.${BASE_DOMAIN:-snake.test}
    depends_on:
      app:
        condition: service_started
      commander-web:
        condition: service_started

  # Commander operator-panel SPA — static build served by its own nginx (commander/Dockerfile).
  # Reachable at https://commander.${BASE_DOMAIN} through the main nginx (which also serves /api,
  # so the panel and its API share one origin: no CORS, no Vite proxy).
  commander-web:
    image: snakecloud-commander-web
    build:
      context: ./commander
    restart: unless-stopped
    networks:
      - app-network

  # MariaDB Service
  db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      # Root sin password: SOLO local. Las BDs de suscripciones las crea
      # scripts/subscription.sh con sus propias credenciales por paquete.
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
