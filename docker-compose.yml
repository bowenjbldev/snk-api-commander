services:
  # PHP Application (Laravel)
  app:
    image: snk-api-commander-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    restart: unless-stopped
    working_dir: /var/www/src
    cpus: "${APP_CONTAINER_CPUS:-6.0}"
    mem_limit: "${APP_CONTAINER_MEMORY:-2g}"
    pids_limit: ${APP_CONTAINER_PIDS:-128}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./src:/var/www/src
      # Historial Git (solo lectura) para insights por aplicación, acotado al package compartido.
      - ./.git:/var/www/.git:ro
      - /var/www/src/bootstrap/cache
      - ./docker/php/commander.ini:/usr/local/etc/php/conf.d/zz-commander.ini:ro
    # Octane sobre FrankenPHP: ocho workers reciclados cada 500 peticiones. OCTANE_WORKERS los
    # recalibra sin tocar Compose; los workers guardan la aplicación en memoria, así que un cambio
    # de código PHP se ve tras `php artisan octane:reload`.
    command: ["php", "artisan", "octane:frankenphp", "--host=0.0.0.0", "--port=8000", "--workers=${OCTANE_WORKERS:-8}", "--max-requests=500"]
    environment:
      DB_USERNAME: ${COMMANDER_DB_USERNAME:-commander_app}
      DB_PASSWORD: ${COMMANDER_DB_PASSWORD:-commander-local-secret}
      DB_QUEUE_CONNECTION: commander
      DB_CACHE_CONNECTION: commander
      OCTANE_HTTPS: "true"
      # Solo nginx llega a este Octane, y sin fiarse de su X-Forwarded-For toda la calle
      # tiene la IP del proxy: el contador de lectores distintos colapsa por navegador y día.
      # Va de la mano de `proxy_set_header X-Forwarded-For $remote_addr` en el nginx: sin
      # esa línea la cabecera la pondría el cliente y esta variable se la creería.
      TRUSTED_PROXIES: '*'
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      app-network:
        aliases:
          - api-app

  # Perfil `dev`: los workers de Octane guardan la aplicación en memoria, y esto los recarga solo
  # al cambiar código, config o `.env`, que es lo que en local hace de `octane:reload`. Comparte la
  # red de `app` porque el puerto de administración de Caddy (2019) solo escucha en loopback, y le
  # pide reiniciar los workers, que vuelven a arrancar Laravel leyendo el disco. Producción no va por
  # Docker ni necesita esto.
  watch:
    profiles: ["dev"]
    image: node:24-alpine
    restart: unless-stopped
    network_mode: "service:app"
    working_dir: /src
    environment:
      # chokidar-cli ejecuta `-c` con $SHELL y la imagen no lo define.
      SHELL: /bin/sh
    volumes:
      - ./src:/src:ro
      - watch_npm:/root/.npm
    command: >-
      npx -y chokidar-cli
      "/src/app/**/*.php" "/src/packages/**/*.php" "/src/config/**/*.php"
      "/src/bootstrap/**/*.php" "/src/routes/**/*.php" "/src/.env" "/src/composer.lock"
      --ignore "**/vendor/**" --ignore "**/node_modules/**" --debounce 500
      -c "wget -qO- --post-data= http://127.0.0.1:2019/frankenphp/workers/restart && echo workers reloaded"
    depends_on:
      app:
        condition: service_started

  # Los otros dos runtimes de la misma API, para medirlos contra `app` con `scripts/octane-ab.sh`:
  # php-fpm (perfil `fpm`, nginx :8444) y Octane sobre Swoole (perfil `swoole`, nginx :8445).
  # Mismo código, mismos límites y mismos ocho workers reciclados cada 500 que `app`. Saltan el
  # entrypoint como scheduler: vendor/, migraciones y catálogo ya los deja `app`.
  fpm:
    profiles: ["fpm"]
    image: snk-api-commander-fpm
    build:
      context: .
      dockerfile: docker/php/fpm.Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    restart: unless-stopped
    working_dir: /var/www/src
    cpus: "${APP_CONTAINER_CPUS:-6.0}"
    mem_limit: "${APP_CONTAINER_MEMORY:-2g}"
    pids_limit: ${APP_CONTAINER_PIDS:-128}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sh", "-c"]
    command: ["php artisan package:discover --ansi >/dev/null && exec php-fpm"]
    volumes:
      - ./src:/var/www/src
      - ./.git:/var/www/.git:ro
      - /var/www/src/bootstrap/cache
      - ./docker/php/commander.ini:/usr/local/etc/php/conf.d/zz-commander.ini:ro
      - ./docker/php/fpm.conf:/usr/local/etc/php-fpm.d/zzzz-commander.conf:ro
    environment:
      DB_USERNAME: ${COMMANDER_DB_USERNAME:-commander_app}
      DB_PASSWORD: ${COMMANDER_DB_PASSWORD:-commander-local-secret}
      DB_QUEUE_CONNECTION: commander
      DB_CACHE_CONNECTION: commander
      TRUSTED_PROXIES: '*'
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - api-fpm

  octane-swoole:
    profiles: ["swoole"]
    image: snk-api-commander-swoole
    build:
      context: .
      dockerfile: docker/php/swoole.Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    restart: unless-stopped
    working_dir: /var/www/src
    cpus: "${APP_CONTAINER_CPUS:-6.0}"
    mem_limit: "${APP_CONTAINER_MEMORY:-2g}"
    pids_limit: ${APP_CONTAINER_PIDS:-128}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sh", "-c"]
    command: ["php artisan package:discover --ansi >/dev/null && exec php artisan octane:swoole --host=0.0.0.0 --port=8000 --workers=${OCTANE_WORKERS:-8} --max-requests=500"]
    volumes:
      - ./src:/var/www/src
      - ./.git:/var/www/.git:ro
      - /var/www/src/bootstrap/cache
      - ./docker/php/commander.ini:/usr/local/etc/php/conf.d/zz-commander.ini:ro
    environment:
      DB_USERNAME: ${COMMANDER_DB_USERNAME:-commander_app}
      DB_PASSWORD: ${COMMANDER_DB_PASSWORD:-commander-local-secret}
      DB_QUEUE_CONNECTION: commander
      DB_CACHE_CONNECTION: commander
      TRUSTED_PROXIES: '*'
      OCTANE_SERVER: swoole
      OCTANE_HTTPS: "true"
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - api-swoole

  # Laravel scheduler: dispara los comandos programados (commander:* y kilkana:*).
  # schedule:work corre en foreground y evalúa el schedule cada minuto — el
  # equivalente Docker del cron `schedule:run`. Reusa la imagen del app pero
  # salta su entrypoint (migraciones/permisos ya los hace app); restart cubre
  # el arranque en frío mientras app instala vendor/.
  scheduler:
    image: snk-api-commander-app
    restart: unless-stopped
    working_dir: /var/www/src
    entrypoint: ["php", "artisan", "schedule:work"]
    volumes:
      - ./src:/var/www/src
      - ./.git:/var/www/.git:ro
      - /var/www/src/bootstrap/cache
      - ./docker/php/commander.ini:/usr/local/etc/php/conf.d/zz-commander.ini:ro
    environment:
      DB_USERNAME: ${COMMANDER_DB_USERNAME:-commander_app}
      DB_PASSWORD: ${COMMANDER_DB_PASSWORD:-commander-local-secret}
      DB_QUEUE_CONNECTION: commander
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - app-network

  # Worker de la cola `database`: lo que un periódico encola desde una petición —las tandas
  # del boletín— corre aquí, en la base de la instalación y no en la del periódico, y cada
  # trabajo se conecta a su inquilino antes de tocar nada. Misma imagen que app, sin entrypoint.
  queue:
    image: snk-api-commander-app
    restart: unless-stopped
    working_dir: /var/www/src
    entrypoint: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - ./src:/var/www/src
      - ./.git:/var/www/.git:ro
      - /var/www/src/bootstrap/cache
      - ./docker/php/commander.ini:/usr/local/etc/php/conf.d/zz-commander.ini:ro
    environment:
      DB_USERNAME: ${COMMANDER_DB_USERNAME:-commander_app}
      DB_PASSWORD: ${COMMANDER_DB_PASSWORD:-commander-local-secret}
      DB_QUEUE_CONNECTION: commander
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - app-network

  # Unico proceso con credenciales capaces de crear/eliminar bases y usuarios.
  provisioner:
    image: snk-api-commander-app
    restart: unless-stopped
    working_dir: /var/www/src
    entrypoint: ["sh", "-c"]
    command: ["php artisan commander:secure-tenants && exec php artisan queue:work --queue=provisioning --tries=3 --timeout=600"]
    volumes:
      - ./src:/var/www/src
      - /var/www/src/bootstrap/cache
      - ./docker/php/commander.ini:/usr/local/etc/php/conf.d/zz-commander.ini:ro
    environment:
      DB_USERNAME: ${COMMANDER_DB_USERNAME:-commander_app}
      DB_PASSWORD: ${COMMANDER_DB_PASSWORD:-commander-local-secret}
      PROVISIONER_DB_HOST: db
      PROVISIONER_DB_PORT: 3306
      PROVISIONER_DB_DATABASE: commander
      PROVISIONER_DB_USERNAME: root
      PROVISIONER_DB_PASSWORD: ${PROVISIONER_DB_PASSWORD:-}
      CORE_ADMIN_EMAIL: ${CORE_ADMIN_EMAIL:-admin@snake.com}
      CORE_ADMIN_PASSWORD: ${CORE_ADMIN_PASSWORD:-secret1234}
      KILKANA_DEMO_READER_PASSWORD: ${KILKANA_DEMO_READER_PASSWORD:-password}
    depends_on:
      app:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    networks:
      - app-network

  # Nginx Service
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - BASE_DOMAIN=${BASE_DOMAIN:-snakepc.test}
      - TENANT_BASE_DOMAIN=${TENANT_BASE_DOMAIN:-commander.test}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # La misma API sobre php-fpm y Swoole, solo con el perfil `fpm`/`swoole` levantado.
      - "${FPM_HTTPS_PORT:-8444}:8444"
      - "${SWOOLE_HTTPS_PORT:-8445}:8445"
      # Las URLs limpias de Commander usan otra IP de loopback para no compartir
      # proxy, red ni certificados con los productos locales.
      - "127.0.0.2:80:80"
      - "127.0.0.2:443:443"
    volumes:
      - ./src:/var/www/src
      - ./docker/nginx/conf.d/:/etc/nginx/templates/:ro
      - ./docker/nginx/certs/:/etc/nginx/certs/:ro
    networks:
      app-network:
        aliases:
          - commander.${BASE_DOMAIN:-snakepc.test}
    depends_on:
      app:
        condition: service_started

  # Punto de conexión opcional para un futuro cliente web de Commander.
  # No arranca con el backend: se activa explícitamente con `--profile spa`
  # después de crear `commander-web/package.json`.
  commander-web:
    profiles: ["spa"]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./commander-web:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    networks:
      - app-network

  # MariaDB: una base de control y una base aislada por instancia.
  db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      # Root sin password (SOLO local): únicamente el provisioner recibe estas credenciales DDL.
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: commander
      MARIADB_USER: ${COMMANDER_DB_USERNAME:-commander_app}
      MARIADB_PASSWORD: ${COMMANDER_DB_PASSWORD:-commander-local-secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # Bandeja de salida de mentira, para ver el correo como lo ve el lector. Captura TODO lo que
  # la app manda por SMTP y no lo deja salir, que es justo lo que se quiere en local: nadie
  # envía un boletín de pruebas a una dirección real por accidente.
  #
  # Sin volumen a propósito: la bandeja es efímera. Lo que importa del correo —a quién se le
  # mandó y en qué estado quedó— ya vive en la base.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app-network

  # Compatibilidad con volúmenes existentes: asegura el usuario no privilegiado de Commander.
  db-init:
    image: mariadb:latest
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mariadb --ssl=0 -h db -uroot -e "CREATE USER IF NOT EXISTS '${COMMANDER_DB_USERNAME:-commander_app}'@'%' IDENTIFIED BY '${COMMANDER_DB_PASSWORD:-commander-local-secret}';
        ALTER USER '${COMMANDER_DB_USERNAME:-commander_app}'@'%' IDENTIFIED BY '${COMMANDER_DB_PASSWORD:-commander-local-secret}';
        GRANT ALL PRIVILEGES ON commander.* TO '${COMMANDER_DB_USERNAME:-commander_app}'@'%';"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  # Caché de npm del watcher: sin ella `npx` descarga chokidar-cli en cada arranque.
  watch_npm:
