[global]
rlimit_files = 65536

[www]
pm = static
pm.max_children = 8
pm.max_requests = 500
listen.backlog = 1024
rlimit_files = 65536

; Nginx y Commander ya registran cada request; el access log FPM era duplicado.
access.log = /dev/null
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
request_terminate_timeout = 60s
