expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; 512M: una foto de 20 megapíxeles ocupa 76 MB solo de origen en GD, más el máster; con 128M la
; subida moría en un 500 sin mensaje. Vale para los cuatro servicios de PHP, que montan este fichero.
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
output_buffering = 4096

; Kilkana valida ficheros de hasta 50 MiB; el multipart necesita margen adicional.
upload_max_filesize = 64M
post_max_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 300
zend.assertions = -1
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0
cgi.fix_pathinfo = 0

; 7.637 clases compiladas consumen 114 MiB y llenan el buffer de strings de 8 MiB. También en
; CLI: los workers de Octane sobre Swoole corren bajo ese SAPI, y los comandos programados ganan.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
; JIT tracing, medido el 06-09-2026 (docs/operations.md, «Coste común por petición»): +6-9 % de
; throughput en las rutas que mandan PHP y plano donde manda MariaDB. El búfer es memoria compartida
; del proceso, una vez; 400 peticiones de una ruta usaron 1 MiB, y 64 sobra para toda la API.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

mysqlnd.collect_statistics = Off
mysqlnd.collect_memory_statistics = Off
